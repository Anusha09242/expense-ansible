- name: nodejs setup
  import_role:
    name: common
    tasks_from: nodejs

- name: app setup
  import_role:
    name: common
    tasks_from: app-setup

- name: systemd setup
  import_role:
    name: common
    tasks_from: systemd-setup

- name: install mysql
  package:
    name: mysql
    state: present

- name: restart
  import_role:
    name: common
    tasks_from: restart
    
