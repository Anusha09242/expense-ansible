- name: install mysql server
  package:
    name: mysql-server
    state: present

- name: enable and start mysqld
  service:
    name: mysqld
    enabled: yes
    state: started

- name: install mysql
  package:
    name: mysql
    state: present

- name: install python dependencies
  pip:
    name: PyMySQL
    executable: pip3.9

- name: setup root password
  command: mysql_secure_installation --set-root-pass "{{ mysql_root_password }}"
